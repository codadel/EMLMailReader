[build-system]
requires      = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emlmailreader"
version = "2.0.0"
description = "Parse EML file and export the information extracted as JSON."
readme = "README.md"
authors = [{ name = "Mahesh Kumaar Balaji", email = "mahbalaji@outlook.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3"
]
keywords = ["email", "reader", "eml", "parser"]
dependencies = []
requires-python = ">=3.12"

[tool.setuptools]
packages = ["EMLMailReader"]

[tool.setuptools.package-data]
EMLMailReader = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--tb=short", "--strict-markers"]
log_cli = false
markers = [
    "functional: tests that parse real EML files or exercise filesystem behavior"
]

[tool.coverage.run]
source = ["EMLMailReader"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
required-version = "==0.16.0"
target-version = "py312"
line-length = 88
src = ["."]
force-exclude = true
extend-exclude = ["build", "dist", "htmlcov", "graphify-out"]
preview = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"EMLMailReader/Enumerations.py" = ["UP042"]
"EMLMailReader/Standards.py" = ["UP042"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["EMLMailReader", "tests"]
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
enable_error_code = ["ignore-without-code"]

[project.urls]
Homepage = "https://github.com/codadel/EMLMailReader"
Issues = "https://github.com/codadel/EMLMailReader/issues"
Changelog = "https://github.com/codadel/EMLMailReader/blob/release/changelog.md"
