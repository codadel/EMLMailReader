[build-system]
requires      = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emlmailreader"
version = "1.0.4"
description = "Parse EML file and export the information extracted as JSON."
readme = "README.md"
authors = [{ name = "Mahesh Kumaar Balaji", email = "mahbalaji@outlook.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3"
]
keywords = ["email", "reader", "eml", "parser"]
dependencies = []
requires-python = ">=3.12"

[tool.setuptools]
packages = ["EMLMailReader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--tb=short", "--strict-markers"]
log_cli = false
markers = [
    "functional: tests that parse real EML files or exercise filesystem behavior"
]

[tool.coverage.run]
source = ["EMLMailReader"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[project.urls]
Homepage = "https://github.com/codadel/EMLMailReader"
Issues = "https://github.com/codadel/EMLMailReader/issues"
Changelog = "https://github.com/codadel/EMLMailReader/blob/release/changelog.md"
