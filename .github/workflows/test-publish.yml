name: Publish merged version to TestPyPI

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

concurrency:
  group: testpypi-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate_and_build:
    name: Quality-check and build TestPyPI candidate
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.metadata.outputs.base_version }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve and apply next TestPyPI release candidate
        id: metadata
        run: >-
          python -m scripts.test_release_metadata
          --write-version
          --github-output "${GITHUB_OUTPUT}"

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e . -r requirements.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Run lint checks
        run: ruff check .

      - name: Run static type checks
        run: mypy EMLMailReader tests

      - name: Run tests with branch coverage
        run: >-
          pytest
          --cov=EMLMailReader
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=95

      - name: Build package distributions
        run: python -m build

      - name: Upload package distributions
        uses: actions/upload-artifact@v7
        with:
          name: testpypi-python-package-distributions
          path: dist/
          if-no-files-found: error

      - name: Summarize candidate
        env:
          BASE_VERSION: ${{ steps.metadata.outputs.base_version }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          echo "### TestPyPI candidate" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Source version: ${BASE_VERSION}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Candidate version: ${VERSION}" >> "${GITHUB_STEP_SUMMARY}"

  publish_test_package:
    name: Publish package to TestPyPI
    needs: validate_and_build
    if: ${{ needs.validate_and_build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/emlmailreader
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v8
        with:
          name: testpypi-python-package-distributions
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
