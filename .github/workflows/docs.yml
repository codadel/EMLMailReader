name: Documentation checks

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install package and documentation tools
        run: python -m pip install -e . -r requirements-docs.txt

      - name: Build current major-version documentation
        run: python scripts/docs.py build v2
