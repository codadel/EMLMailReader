name: Publish v1 documentation

on:
  push:
    branches:
      - docs/v1-portal
  workflow_dispatch:

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install package and documentation tools
        run: python -m pip install -e . -r requirements-docs.txt

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Configure documentation publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch existing documentation versions
        run: git fetch origin gh-pages --depth=1 || true

      - name: Publish v1 documentation
        run: |
          mike deploy --branch gh-pages --push --update-aliases --title "v1 · 1.0.4" v1 latest stable
          mike set-default --branch gh-pages --push latest

      - name: Prepare versioned site artifact
        run: |
          git fetch origin gh-pages --force
          mkdir pages-site
          git archive origin/gh-pages | tar -x -C pages-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
