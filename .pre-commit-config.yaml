minimum_pre_commit_version: "4.6.0"
fail_fast: true

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-format
        args: [--check]
        always_run: true
        pass_filenames: false
      - id: ruff-check
        always_run: true
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: [EMLMailReader, tests]
        additional_dependencies:
          - pytest==9.1.1
        always_run: true
        pass_filenames: false
